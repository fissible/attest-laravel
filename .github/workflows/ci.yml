name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (L${{ matrix.laravel }}, php${{ matrix.php }}, ${{ matrix.db }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Each Laravel major is pinned via its orchestra/testbench major
      # (testbench ^9→L11, ^10→L12, ^11→L13) so the declared support range
      # "^11 || ^12 || ^13" is exercised at both ends. Laravel 13 requires
      # PHP ^8.3, so PHP 8.2 is only paired with L11/L12.
      matrix:
        include:
          # ---- Laravel 13 (current; PHP 8.3+) ----
          - { php: '8.3', laravel: '13', testbench: '^11.0', db: 'sqlite',  os: 'ubuntu-latest' }
          - { php: '8.4', laravel: '13', testbench: '^11.0', db: 'sqlite',  os: 'ubuntu-latest' }
          - { php: '8.3', laravel: '13', testbench: '^11.0', db: 'sqlite',  os: 'macos-latest' }
          - { php: '8.4', laravel: '13', testbench: '^11.0', db: 'sqlite',  os: 'macos-latest' }
          - { php: '8.3', laravel: '13', testbench: '^11.0', db: 'mysql8',  os: 'ubuntu-latest' }
          - { php: '8.4', laravel: '13', testbench: '^11.0', db: 'mysql8',  os: 'ubuntu-latest' }
          - { php: '8.3', laravel: '13', testbench: '^11.0', db: 'pgsql16', os: 'ubuntu-latest' }
          - { php: '8.4', laravel: '13', testbench: '^11.0', db: 'pgsql16', os: 'ubuntu-latest' }
          # ---- Laravel 12 (PHP 8.2 floor) ----
          - { php: '8.2', laravel: '12', testbench: '^10.0', db: 'sqlite',  os: 'ubuntu-latest' }
          - { php: '8.4', laravel: '12', testbench: '^10.0', db: 'mysql8',  os: 'ubuntu-latest' }
          # ---- Laravel 11 (minimum supported) ----
          - { php: '8.2', laravel: '11', testbench: '^9.0',  db: 'sqlite',  os: 'ubuntu-latest' }
          - { php: '8.2', laravel: '11', testbench: '^9.0',  db: 'pgsql16', os: 'ubuntu-latest' }

    services:
      mysql:
        image: ${{ matrix.db == 'mysql8' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: attest
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: ${{ matrix.db == 'pgsql16' && 'postgres:16' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attest
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v5
        with:
          path: attest-laravel

      - uses: actions/checkout@v5
        with:
          repository: fissible/attest
          ref: main
          path: attest

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, zip, json, pdo_sqlite, pdo_mysql, pdo_pgsql, pcntl
          coverage: none

      - name: Validate composer.json
        working-directory: attest-laravel
        run: composer validate --strict

      - name: Pin Laravel major (testbench ${{ matrix.testbench }})
        working-directory: attest-laravel
        run: composer require --dev --no-update --no-interaction "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install
        working-directory: attest-laravel
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: PHPStan
        working-directory: attest-laravel
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit (sqlite)
        if: matrix.db == 'sqlite'
        working-directory: attest-laravel
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: vendor/bin/phpunit --colors=always

      - name: PHPUnit (mysql8)
        if: matrix.db == 'mysql8'
        working-directory: attest-laravel
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: attest
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/phpunit --colors=always

      - name: PHPUnit (pgsql16)
        if: matrix.db == 'pgsql16'
        working-directory: attest-laravel
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: attest
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: vendor/bin/phpunit --colors=always

      - name: PHPUnit concurrency (sqlite, file-backed)
        if: matrix.db == 'sqlite' && matrix.os == 'ubuntu-latest'
        working-directory: attest-laravel
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: /tmp/attest-concurrency.sqlite
        run: |
          rm -f /tmp/attest-concurrency.sqlite
          vendor/bin/phpunit --filter EloquentConcurrencyTest --colors=always
