name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (php${{ matrix.php }}, ${{ matrix.db }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        db: ['sqlite']
        os: ['ubuntu-latest', 'macos-latest']
        include:
          - php: '8.2'
            db: 'mysql8'
            os: 'ubuntu-latest'
          - php: '8.3'
            db: 'mysql8'
            os: 'ubuntu-latest'
          - php: '8.4'
            db: 'mysql8'
            os: 'ubuntu-latest'
          - php: '8.2'
            db: 'pgsql16'
            os: 'ubuntu-latest'
          - php: '8.3'
            db: 'pgsql16'
            os: 'ubuntu-latest'
          - php: '8.4'
            db: 'pgsql16'
            os: 'ubuntu-latest'

    services:
      mysql:
        image: ${{ matrix.db == 'mysql8' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: attest
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: ${{ matrix.db == 'pgsql16' && 'postgres:16' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attest
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          path: attest-laravel

      - uses: actions/checkout@v4
        with:
          repository: fissible/attest
          ref: main
          path: attest

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, zip, json, pdo_sqlite, pdo_mysql, pdo_pgsql, pcntl
          coverage: none

      - name: Validate composer.json
        working-directory: attest-laravel
        run: composer validate --strict

      - name: Install
        working-directory: attest-laravel
        run: composer install --prefer-dist --no-progress

      - name: PHPStan
        working-directory: attest-laravel
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit (sqlite)
        if: matrix.db == 'sqlite'
        working-directory: attest-laravel
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: vendor/bin/phpunit --colors=always

      - name: PHPUnit (mysql8)
        if: matrix.db == 'mysql8'
        working-directory: attest-laravel
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: attest
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/phpunit --colors=always

      - name: PHPUnit (pgsql16)
        if: matrix.db == 'pgsql16'
        working-directory: attest-laravel
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: attest
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: vendor/bin/phpunit --colors=always

      - name: PHPUnit concurrency (sqlite, file-backed)
        if: matrix.db == 'sqlite' && matrix.os == 'ubuntu-latest'
        working-directory: attest-laravel
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: /tmp/attest-concurrency.sqlite
        run: |
          rm -f /tmp/attest-concurrency.sqlite
          vendor/bin/phpunit --filter EloquentConcurrencyTest --colors=always
